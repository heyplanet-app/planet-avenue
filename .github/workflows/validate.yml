# Checks apps.json on every push and pull request. Publishing is
# Cloudflare's own (Workers Builds, wrangler.jsonc): it serves this
# repository as-is at avenue.heyplanet.app.
name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Validate
        run: xmake validate
